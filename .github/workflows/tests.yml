name: Local evidence and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_artifacts.py
      - run: python -m unittest discover -s tests -v
# No deployment, cloud credentials, training or artifact replacement in CI.
